name: Validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  directus:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: docker run --rm --user "$(id -u):$(id -g)" -e npm_config_cache=/tmp/npm -v "$PWD:/app" -w /app node:22-bookworm npm ci
      - name: Test and build
        run: docker run --rm --user "$(id -u):$(id -g)" -e npm_config_cache=/tmp/npm -v "$PWD:/app" -w /app node:22-bookworm sh -c 'npm test && npm run build && npm run validate && npm pack --dry-run'
      - name: Audit dependencies
        run: docker run --rm --user "$(id -u):$(id -g)" -e npm_config_cache=/tmp/npm -v "$PWD:/app" -w /app node:22-bookworm npm audit --audit-level=low
      - name: Installed Directus smoke test
        run: python3 test/docker-smoke.py
